# ==========================================
# 1. NAMESPACE
# ==========================================
apiVersion: v1
kind: Namespace
metadata:
  name: auth-app

---
# ==========================================
# 2. DATABASE INITIALIZATION SCRIPT (CONFIGMAP)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-db-init-script
  namespace: auth-app
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS api_keys (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        key_hash VARCHAR(64) NOT NULL UNIQUE,
        is_active BOOLEAN DEFAULT true,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

---
# ==========================================
# 3. DATABASE MIGRATION JOB
# ==========================================
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-init-job
  namespace: auth-app
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-migrator
        image: postgres:16-alpine
        command: ["psql", "-f", "/scripts/init.sql"]
        env:
        - name: PGHOST
          value: "auth-db.cdp7hxfglmyr.us-east-1.rds.amazonaws.com"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: "postgres"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: password
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: auth-db-init-script

---
# ==========================================
# 4. AUTH SERVICE DEPLOYMENT
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: 736641246442.dkr.ecr.us-east-1.amazonaws.com/auth-service:latest
        ports:
        - containerPort: 8001
        env:
        - name: PORT
          value: "8001"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: password
        - name: MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: auth-app-secrets
              key: MASTER_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: DATABASE_URL

---
# ==========================================
# 5. INTERNAL CLUSTER SERVICE
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: auth-app
spec:
  selector:
    app: auth-service
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP

---
# ==========================================
# 6. NGINX INGRESS
# ==========================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-ingress
  namespace: auth-app
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: auth-service
            port:
              number: 8001
