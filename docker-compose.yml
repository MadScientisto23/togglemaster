services:
  auth-service:
    depends_on:
      postgres-auth-service:
        condition: service_healthy
    build:
      context: ./auth-service
    ports:
      - "8001:8001"
    env_file:
      - ./auth-service/.env
    networks:
      - toggle-net

  postgres-auth-service:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./auth-service/.env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - auth-service-pgdata:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - toggle-net

  analytics-service:
    build:
      context: ./analytics-service
    ports:
      - "8005:8005"
    env_file:
      - ./analytics-service/.env
    networks:
      - toggle-net

  flag-service:
    build:
      context: ./flag-service
    ports:
      - "8002:8002"
    depends_on:
      postgres-flag-service:
        condition: service_healthy
    env_file:
      - ./flag-service/.env
    networks:
      - toggle-net

  postgres-flag-service:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./flag-service/.env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - flag-service-pgdata:/var/lib/postgresql/data
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - toggle-net


  targeting-service:
    build:
      context: ./targeting-service
    ports:
      - "8003:8003"
    depends_on:
      postgres-targeting-service:
        condition: service_healthy
    env_file:
      - ./targeting-service/.env
    networks:
      - toggle-net

  postgres-targeting-service:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./targeting-service/.env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - targeting-service-pgdata:/var/lib/postgresql/data
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - toggle-net

  evaluation-service:
    depends_on:
      redis-evaluation-service:
        condition: service_healthy
    build:
      context: ./evaluation-service
    ports:
      - "8004:8004"
    env_file:
      - ./evaluation-service/.env
    networks:
      - toggle-net

  redis-evaluation-service:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - evaluation-service-redisdata:/data
    networks:
      - toggle-net

volumes:
  flag-service-pgdata:
  auth-service-pgdata:
  targeting-service-pgdata:
  evaluation-service-redisdata:

networks:
  toggle-net:
    driver: bridge
