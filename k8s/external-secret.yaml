apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-secret
  namespace: togglemaster
spec:
  refreshInterval: "1h" # De quanto em quanto tempo ele verifica atualizações na AWS
  secretStoreRef:
    name: aws-secretsmanager # Referência ao seu backend configurado no cluster
    kind: ClusterSecretStore
  target:
    name: auth-service-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ .DATABASE_URL }}"
        MASTER_KEY: "{{ .MASTER_KEY }}"
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: auth-service-secret
        property: DATABASE_URL
    - secretKey: MASTER_KEY
      remoteRef:
        key: auth-service-secret
        property: MASTER_KEY
